name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# `vars.*` lets you store the registry hostname as a non-secret repo
# variable; `secrets.*` is kept as a fallback for the original setup.
# Either side wins — whichever you configured.
env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY_URL || secrets.DOCKER_REGISTRY_URL }}
  IMAGE_NAME: nextjs-saas-template

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast with a clear message when the registry env vars
      # aren't wired up. Without this, the next step writes a broken
      # daemon.json and Docker exits with a confusing systemd error.
      - name: Verify required configuration
        run: |
          missing=()
          [ -z "${REGISTRY}" ] && missing+=("DOCKER_REGISTRY_URL (vars or secrets)")
          [ -z "${{ secrets.DOCKER_REGISTRY_USERNAME }}" ] && missing+=("DOCKER_REGISTRY_USERNAME (secret)")
          [ -z "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" ] && missing+=("DOCKER_REGISTRY_PASSWORD (secret)")
          [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ] && missing+=("DOKPLOY_WEBHOOK_URL (secret)")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GHA configuration:"
            for m in "${missing[@]}"; do echo "::error::  - $m"; done
            exit 1
          fi
          echo "REGISTRY=${REGISTRY}"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME}"

      - name: Compute image tag
        id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Allow self-signed Docker registry
        run: |
          echo "{\"insecure-registries\": [\"${REGISTRY}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              insecure = true

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Retag current latest as rollback
        continue-on-error: true
        run: |
          docker buildx imagetools create \
            -t ${{ steps.image.outputs.ref }}:rollback \
            ${{ steps.image.outputs.ref }}:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://template.rahulverma.cc' }}

      - name: Trigger Dokploy deploy
        run: |
          curl -sf -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
